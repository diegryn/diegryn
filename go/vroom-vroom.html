<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Die Gryn | Vroom Vroom</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Die Gryn — Vroom Vroom, out now.">

<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow-x:hidden;}

  body{
    font-family:'Raleway',sans-serif;
    color:rgb(248,234,234);
    min-height:100%;
    position:relative;
  }

  /* ================= HERO — matches diegryn.com's hero exactly ================= */
  .hero{
    height:100vh;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
  }

  .hero::before{
    content:"";
    position:absolute;
    inset:0;
    background:
      linear-gradient(rgba(0,0,0,0.15), rgba(0,0,0,0.15)),
      url("/vroomvroom3.jpg") center 20% / cover no-repeat,
      #0c0c0c;
    z-index:0;
  }

  .hero::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.35);
    z-index:1;
  }

  .hero-content{
    position:relative;
    z-index:2;
    text-align:center;
    transform:translateY(60px);
    padding:24px;
  }

  /* LOGO — same font/letterspacing as diegryn.com header */
  .logo-text{
    position:absolute;
    top:28px;
    left:50%;
    transform:translateX(-50%);
    font-family:'Times New Roman', serif;
    font-size:28px;
    letter-spacing:6px;
    font-weight:600;
    text-transform:uppercase;
    z-index:3;
  }

  .eyebrow{
    font-size:12px;
    letter-spacing:3px;
    text-transform:uppercase;
    opacity:0.8;
    margin-bottom:14px;
  }

  .hero h1{
    font-size:52px;
    letter-spacing:6px;
    line-height:1.1;
    margin-bottom:10px;
  }

  .hero p.sub{
    margin-top:10px;
    opacity:0.8;
    font-size:14px;
    margin-bottom:28px;
    letter-spacing:0.3px;
  }

  /* CTA — same shape as diegryn.com's .cta (plain border, no rounding) */
  .cta{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:10px 28px;
    border:1px solid white;
    margin-top:0;
    font-size:17px;
    letter-spacing:0.5px;
    text-decoration:none;
    color:inherit;
    background:transparent;
    cursor:pointer;
    position:relative;
    z-index:3;
    transition:0.25s ease;
    opacity:0.4;
    pointer-events:none;
    min-width:230px;
  }

  .cta.unlocked{
    opacity:1;
    pointer-events:auto;
    border-color:#8B0000;
    background:#8B0000;
  }

  .cta.unlocked:hover{background:transparent;color:white;}

  .cta .spinner{
    width:12px;height:12px;
    border:2px solid rgba(248,234,234,0.35);
    border-top-color:rgb(248,234,234);
    border-radius:50%;
    animation:spin 0.8s linear infinite;
  }
  .cta.unlocked .spinner{display:none;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .fineprint{
    margin-top:24px;
    font-size:11px;
    opacity:0.5;
    letter-spacing:0.4px;
  }

  #turnstile-container{position:absolute;width:0;height:0;overflow:hidden;}

  @media (max-width:768px){
    .logo-text{font-size:20px;letter-spacing:4px;top:22px;}
    .hero h1{font-size:38px;letter-spacing:4px;}
  }
</style>
</head>

<body>

<div class="logo-text">DIE GRYN</div>

<section class="hero">
  <div class="hero-content">
    <div class="eyebrow">New Single</div>
    <h1>VROOM VROOM</h1>
    <p class="sub">Tap below to save it to your library</p>

    <button id="ctaBtn" class="cta" disabled>
      <span class="spinner"></span>
      <span id="ctaLabel">Preparing your link…</span>
    </button>

    <div class="fineprint">Opens in Spotify, Apple Music &amp; more</div>
  </div>
</section>

<div id="turnstile-container"></div>

<script>
/* =========================================================================
   CONFIG
   ========================================================================= */
  const DESTINATION_URL   = "https://ffm.to/vroom-vroom";
  const META_PIXEL_ID     = "4529349500683085";
  const TURNSTILE_SITE_KEY = "0x4AAAAAAAE9TfB6BFETbOhZo";
  const VERIFY_ENDPOINT    = "https://diegryn-ad-verify.diegryn.workers.dev/";
  const CAMPAIGN_SLUG      = "vroom-vroom";

  const VERIFY_TIMEOUT_MS = 3000;

/* =========================================================================
   META PIXEL — base code
   ========================================================================= */
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
  n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
  document,'script','https://connect.facebook.net/en_US/fbevents.js');

  fbq('init', META_PIXEL_ID);
  fbq('track', 'PageView');
  fbq('track', 'ViewContent', { content_name: 'Vroom Vroom — Ad Landing Page' });

/* =========================================================================
   Shared event ID for Pixel/CAPI dedup
   ========================================================================= */
  function makeEventId(){
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'evt_' + Date.now() + '_' + Math.random().toString(36).slice(2);
  }
  const EVENT_ID = makeEventId();

  function getQueryParam(name){
    return new URLSearchParams(window.location.search).get(name);
  }
  const FBCLID = getQueryParam('fbclid');

/* =========================================================================
   LAYER 1 — dwell time + real interaction
   ========================================================================= */
  const MIN_DWELL_MS = 4000;
  let hasInteracted = false;
  let dwellPassed = false;
  let layer1Passed = false;

  const btn = document.getElementById('ctaBtn');
  const label = document.getElementById('ctaLabel');

  function markInteraction(){
    hasInteracted = true;
    tryLayer1();
    window.removeEventListener('mousemove', markInteraction);
    window.removeEventListener('touchstart', markInteraction);
    window.removeEventListener('scroll', markInteraction);
    window.removeEventListener('keydown', markInteraction);
  }
  window.addEventListener('mousemove', markInteraction, { passive:true });
  window.addEventListener('touchstart', markInteraction, { passive:true });
  window.addEventListener('scroll', markInteraction, { passive:true });
  window.addEventListener('keydown', markInteraction);

  setTimeout(function(){ dwellPassed = true; tryLayer1(); }, MIN_DWELL_MS);
  setTimeout(function(){ if(!layer1Passed){ hasInteracted = true; tryLayer1(); } }, 9000);

  function tryLayer1(){
    if (layer1Passed || !dwellPassed || !hasInteracted) return;
    layer1Passed = true;
    btn.classList.add('unlocked');
    btn.disabled = false;
    label.textContent = 'Save on Spotify';
  }

/* =========================================================================
   LAYER 2 — Turnstile + Worker verification, runs on click
   ========================================================================= */
  let turnstileWidgetId = null;
  let verifying = false;

  window.onTurnstileLoad = function(){
    turnstileWidgetId = turnstile.render('#turnstile-container', {
      sitekey: TURNSTILE_SITE_KEY,
      size: 'invisible',
      callback: function(token){
        verifyAndRedirect(token);
      },
      'error-callback': function(){
        redirect();
      }
    });
  };

  (function waitForTurnstile(){
    if (window.turnstile){ window.onTurnstileLoad(); }
    else { setTimeout(waitForTurnstile, 150); }
  })();

  btn.addEventListener('click', function(){
    if (!layer1Passed || verifying) return;
    verifying = true;
    label.textContent = 'Verifying…';

    const failOpenTimer = setTimeout(redirect, VERIFY_TIMEOUT_MS);

    if (turnstileWidgetId !== null && window.turnstile){
      turnstile.execute('#turnstile-container');
      window._failOpenTimer = failOpenTimer;
    } else {
      clearTimeout(failOpenTimer);
      redirect();
    }
  });

  function verifyAndRedirect(token){
    clearTimeout(window._failOpenTimer);

    fetch(VERIFY_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        turnstileToken: token,
        eventId: EVENT_ID,
        campaign: CAMPAIGN_SLUG,
        fbclid: FBCLID
      })
    })
    .then(function(res){ return res.json(); })
    .then(function(data){
      fbq('trackCustom', 'RealListener', {
        content_name: 'Vroom Vroom — Ad Landing Page'
      }, { eventID: EVENT_ID });
      redirect();
    })
    .catch(function(){
      redirect();
    });
  }

  function redirect(){
    window.location.href = DESTINATION_URL;
  }
</script>

</body>
</html>
