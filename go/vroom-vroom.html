<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Die Gryn | Vroom Vroom</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Die Gryn — Vroom Vroom, out now.">

<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

<style>
  :root{
    --accent:#8B0000;
    --bg:#0c0c0c;
    --text:#f8eaea;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow-x:hidden;}

  body{
    font-family:'Raleway',sans-serif;
    background:
      radial-gradient(circle at 50% 20%, rgba(139,0,0,0.35), transparent 60%),
      var(--bg);
    color:var(--text);
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
  }

  .logo{
    position:absolute;
    top:28px;
    left:50%;
    transform:translateX(-50%);
    font-family:'Times New Roman', serif;
    font-size:20px;
    letter-spacing:5px;
    font-weight:600;
    text-transform:uppercase;
    opacity:0.85;
  }

  .wrap{max-width:480px;width:100%;}

  .eyebrow{
    font-size:12px;
    letter-spacing:3px;
    text-transform:uppercase;
    opacity:0.65;
    margin-bottom:14px;
  }

  h1{font-size:44px;letter-spacing:5px;line-height:1.1;margin-bottom:12px;}

  .sub{font-size:14px;opacity:0.75;margin-bottom:38px;letter-spacing:0.3px;}

  .cta{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:16px 40px;
    border:1px solid var(--text);
    font-size:15px;
    letter-spacing:2.5px;
    font-weight:600;
    text-transform:uppercase;
    text-decoration:none;
    color:var(--text);
    background:transparent;
    cursor:pointer;
    transition:0.3s ease;
    opacity:0.35;
    pointer-events:none;
    min-width:260px;
  }

  .cta.unlocked{
    opacity:1;
    pointer-events:auto;
    border-color:var(--accent);
    background:var(--accent);
  }

  .cta.unlocked:hover{background:transparent;color:var(--accent);}
  .cta .spinner{
    width:12px;height:12px;
    border:2px solid rgba(248,234,234,0.35);
    border-top-color:var(--text);
    border-radius:50%;
    animation:spin 0.8s linear infinite;
  }
  .cta.unlocked .spinner{display:none;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .fineprint{margin-top:28px;font-size:11px;opacity:0.4;letter-spacing:0.4px;}

  /* Turnstile widget stays invisible on screen (mode: invisible below) */
  #turnstile-container{position:absolute;width:0;height:0;overflow:hidden;}
</style>
</head>

<body>

<div class="logo">DIE GRYN</div>

<div class="wrap">
  <div class="eyebrow">New Single</div>
  <h1>VROOM VROOM</h1>
  <div class="sub">Tap below to save it to your library</div>

  <button id="ctaBtn" class="cta" disabled>
    <span class="spinner"></span>
    <span id="ctaLabel">Preparing your link…</span>
  </button>

  <div class="fineprint">Opens in Spotify, Apple Music &amp; more</div>
</div>

<div id="turnstile-container"></div>

<script>
/* =========================================================================
   CONFIG — edit per campaign / per deploy
   ========================================================================= */
  const DESTINATION_URL   = "https://ffm.to/vroom-vroom";
  const META_PIXEL_ID     = "4529349500683085";
  const TURNSTILE_SITE_KEY = "0x4AAAAAAAE9TfB6BFETbOhZo";
  const VERIFY_ENDPOINT    = "https://diegryn-ad-verify.diegryn.workers.dev/"; // your deployed Worker URL
  const CAMPAIGN_SLUG      = "vroom-vroom";

  // If the worker doesn't respond within this window (outage, cold start,
  // network issue), fail OPEN and redirect anyway — a broken backend
  // should never trap a real fan on the page.
  const VERIFY_TIMEOUT_MS = 3000;

/* =========================================================================
   META PIXEL — base code
   ========================================================================= */
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
  n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
  document,'script','https://connect.facebook.net/en_US/fbevents.js');

  fbq('init', META_PIXEL_ID);
  fbq('track', 'PageView');
  fbq('track', 'ViewContent', { content_name: 'Vroom Vroom — Ad Landing Page' });

/* =========================================================================
   Shared event ID — passed to BOTH the browser pixel event and the
   server-side CAPI event so Meta dedupes them into a single event.
   ========================================================================= */
  function makeEventId(){
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'evt_' + Date.now() + '_' + Math.random().toString(36).slice(2);
  }
  const EVENT_ID = makeEventId();

  function getQueryParam(name){
    return new URLSearchParams(window.location.search).get(name);
  }
  const FBCLID = getQueryParam('fbclid');

/* =========================================================================
   LAYER 1 — dwell time + real interaction (client-side, same as before)
   ========================================================================= */
  const MIN_DWELL_MS = 4000;
  let hasInteracted = false;
  let dwellPassed = false;
  let layer1Passed = false;

  const btn = document.getElementById('ctaBtn');
  const label = document.getElementById('ctaLabel');

  function markInteraction(){
    hasInteracted = true;
    tryLayer1();
    window.removeEventListener('mousemove', markInteraction);
    window.removeEventListener('touchstart', markInteraction);
    window.removeEventListener('scroll', markInteraction);
    window.removeEventListener('keydown', markInteraction);
  }
  window.addEventListener('mousemove', markInteraction, { passive:true });
  window.addEventListener('touchstart', markInteraction, { passive:true });
  window.addEventListener('scroll', markInteraction, { passive:true });
  window.addEventListener('keydown', markInteraction);

  setTimeout(function(){ dwellPassed = true; tryLayer1(); }, MIN_DWELL_MS);
  setTimeout(function(){ if(!layer1Passed){ hasInteracted = true; tryLayer1(); } }, 9000);

  function tryLayer1(){
    if (layer1Passed || !dwellPassed || !hasInteracted) return;
    layer1Passed = true;
    btn.classList.add('unlocked');
    btn.disabled = false;
    label.textContent = 'Save on Spotify';
  }

/* =========================================================================
   LAYER 2 — Turnstile + Worker verification, runs on click
   ========================================================================= */
  let turnstileWidgetId = null;
  let verifying = false;

  window.onTurnstileLoad = function(){
    turnstileWidgetId = turnstile.render('#turnstile-container', {
      sitekey: TURNSTILE_SITE_KEY,
      size: 'invisible',
      callback: function(token){
        verifyAndRedirect(token);
      },
      'error-callback': function(){
        // Turnstile itself failed to run — fail open rather than trap the user.
        redirect();
      }
    });
  };

  // Turnstile's script calls a global callback named in its query string;
  // simplest reliable approach here is polling for the library to be ready.
  (function waitForTurnstile(){
    if (window.turnstile){ window.onTurnstileLoad(); }
    else { setTimeout(waitForTurnstile, 150); }
  })();

  btn.addEventListener('click', function(){
    if (!layer1Passed || verifying) return;
    verifying = true;
    label.textContent = 'Verifying…';

    // Safety timeout — if verification hangs, redirect anyway after
    // VERIFY_TIMEOUT_MS so a backend hiccup never blocks a real fan.
    const failOpenTimer = setTimeout(redirect, VERIFY_TIMEOUT_MS);

    if (turnstileWidgetId !== null && window.turnstile){
      turnstile.execute('#turnstile-container');
      window._failOpenTimer = failOpenTimer;
    } else {
      clearTimeout(failOpenTimer);
      redirect();
    }
  });

  function verifyAndRedirect(token){
    clearTimeout(window._failOpenTimer);

    fetch(VERIFY_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        turnstileToken: token,
        eventId: EVENT_ID,
        campaign: CAMPAIGN_SLUG,
        fbclid: FBCLID
      })
    })
    .then(function(res){ return res.json(); })
    .then(function(data){
      fbq('trackCustom', 'RealListener', {
        content_name: 'Vroom Vroom — Ad Landing Page'
      }, { eventID: EVENT_ID });
      redirect();
    })
    .catch(function(){
      // Network/worker error — still fail open.
      redirect();
    });
  }

  function redirect(){
    window.location.href = DESTINATION_URL;
  }
</script>

</body>
</html>
